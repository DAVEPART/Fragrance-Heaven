server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fragrance_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}

# spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET:yourSecretKeyForJWTTokenGenerationPleaseChangeThisToSecureValue}

# Admin Credentials
admin.email=${ADMIN_EMAIL:admin@fragrance.com}
admin.password=${ADMIN_PASSWORD:admin123}

# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET_KEY:}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# File Storage Configuration
upload.dir=uploads

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}
mail.from=${MAIL_FROM:}

# Thymeleaf Configuration for Email
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Marketing Discount Configuration
discount.trigger.amount=${DISCOUNT_TRIGGER_AMOUNT:5000}
discount.percent=${DISCOUNT_PERCENT:10}
discount.minimum.order.amount=${DISCOUNT_MINIMUM_ORDER_AMOUNT:3000}
discount.valid.days=${DISCOUNT_VALID_DAYS:7}
discount.code.length=${DISCOUNT_CODE_LENGTH:6}
